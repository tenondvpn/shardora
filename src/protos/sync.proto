syntax = "proto2";

package shardora.sync.protobuf;

message SyncItem {
    optional bytes key = 1;
    optional bytes value = 2;
}

message SyncInfo {
    repeated SyncItem items = 1;
}

message SyncHeightItem {
   	optional uint32 pool_idx = 1;
    optional uint64 height = 2;
    optional uint32 tag = 3;
    // A height can be produced by several views (forks), so height alone is not
    // a unique identity.  When the requester already knows which branch it
    // needs, it fills these in so the responder can return that exact block
    // instead of whatever the height->hash index happens to point at.
    optional uint64 view = 4;
    optional bytes view_block_hash = 5;
    // Only meaningful on the kBlockView flow.  `height` there carries the view
    // the requester wants, and this flag says how much of the chain it means:
    //   true  -> exactly that one view, nothing later (a gap being filled, or a
    //            specific view the requester already knows it needs).
    //   false -> from that view onward, as many later views as fit in the
    //            packet (a catch-up by a node that is behind).
    // The two used to be indistinguishable on the wire, so the responder had to
    // guess by comparing the requested view against its own maximum.
    optional bool single_view = 6;
    // Only meaningful on the kBlockView flow, and only on a single_view request.
    // The requester's local height for the view it wants.  A view whose block
    // already committed is reachable by height long after the by-view caches
    // have evicted it (they hold only the last few views), so this is the
    // fallback handle the responder uses when the by-view lookup misses.  The
    // responder must still check the block it finds carries the requested view:
    // the height->hash DB index keeps only one branch per height, so a fork
    // sibling could otherwise be returned for the wrong view.
    optional uint64 block_height = 7;
}

message FlushDbItem {
    optional uint64 max_vec_index = 1;
    optional uint64 max_height = 2;
    repeated uint64 heights = 3;
}

message LatestSyncItem {
    optional uint32 network_id = 1;
    repeated uint64 pool_latest_heights = 2;
    optional uint64 globl_pool_height = 3;
}

message SyncValueRequest {
	optional uint32 network_id = 1;
	repeated bytes keys = 2;
	repeated SyncHeightItem heights = 3;
    optional LatestSyncItem latest_sync_item = 4;
}

message SyncResItem {
    optional bytes key = 1;
    optional bytes value = 2;
	optional uint32 network_id = 3;
	optional uint32 pool_idx = 4;
    optional uint64 height = 5;
    optional uint32 tag = 6;
    optional bytes latest_qc_item = 7;   // serialized QcItem: pool's latest TC/QC (may reference uncommitted block)
    optional bytes qc_view_block = 8;    // serialized ViewBlockItem referenced by latest_qc_item
    // The consensus view that produced this block.  `height` above used to be
    // overloaded with qc().view() on the kViewHash path, which made the two
    // identities indistinguishable on the requester side; keep them separate.
    optional uint64 view = 9;
    // Identity of the returned block.  Together with (network_id, pool_idx)
    // this is what the requester dedups on, because one height can carry
    // multiple competing views.
    optional bytes view_block_hash = 10;
}

message SyncValueResponse {
	optional uint32 network_id = 1;
	repeated SyncResItem res = 2;
}

message SyncMessage {
	optional SyncValueRequest sync_value_req = 1;
	optional SyncValueResponse sync_value_res = 2;
}
